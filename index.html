
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Scroll Target Group</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>

    <!-- Dot Navigation -->
    <nav class="dot-navigation" aria-label="Section navigation">
        <a href="#section1" aria-label="Section 1"></a>
        <a href="#section2" aria-label="Section 2"></a>
        <a href="#section3" aria-label="Section 3"></a>
        <a href="#section4" aria-label="Section 4"></a>
        <a href="#section5" aria-label="Section 5"></a>
    </nav>

    <!-- Sections -->
    <main>
        <section id="section1" class="section section1">
            <h1>Section 01</h1>
            <p>Welcome to the first section.</p>
        </section>

        <section id="section2" class="section section2">
            <h1>Section 02</h1>
            <p>Explore the second section.</p>
        </section>

        <section id="section3" class="section section3">
            <h1>Section 03</h1>
            <p>Discover something new.</p>
        </section>

        <section id="section4" class="section section4">
            <h1>Section 04</h1>
            <p>Keep scrolling to explore.</p>
        </section>

        <section id="section5" class="section section5">
            <h1>Section 05</h1>
            <p>You have reached the final section.</p>
        </section>
    </main>

</body>
</html>
